  services:
    postgres:
      image: postgres:16
      environment:
        POSTGRES_DB: CodeShield
        POSTGRES_PASSWORD: CodeShield123
        POSTGRES_USER: CodeShield
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data

    neo4j:
      image: neo4j:5-community
      environment:
        NEO4J_AUTH: neo4j/pride123
      ports:
        - "7474:7474"
        - "7687:7687"

    redis:
      image: redis:7-alpine
      ports:
        - "6379:6379"

  volumes:
    pgdata: